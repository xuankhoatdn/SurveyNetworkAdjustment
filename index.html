/* ===== KIỂM TRA KHÉP VÒNG LƯỚI MẶT BẰNG (chuyển từ sub KiemTraKhepVong của VBA) ===== */
function khep(I){
 const ctl=new Map(I.ctl.map(c=>[c.n,[c.x,c.y]])),adj=new Map(),SEP='\u0001';
 const link=(a,b)=>{if(!adj.has(a))adj.set(a,new Map());adj.get(a).set(b,true)};

 let steps=0,aborted=false;const LIM=3e6;
 /* 1. các vòng khép: tìm mọi chu trình trong đồ thị nối bởi các góc đo */
 const raw=[];
 const dfsL=(st,cur,path)=>{if(aborted)return;const nb=adj.get(cur);if(!nb)return;
  for(const w of nb.keys()){if(++steps>LIM){aborted=true;return}
   if(w===st&&path.length>=3)raw.push(path.slice());
   else if(!path.includes(w)&&path.length<15){path.push(w);dfsL(st,w,path);path.pop()}}};

  const o=rows.map(r=>r.s),iv=o.map(s=>1296000-s),St=(n-2)*180*3600,Sn=(n+2)*180*3600;
  let best=Infinity,bt='',bv=0,bs=0;
  for(let m=0;m<(1<<n);m++){let c=0;for(let k=0;k<n;k++)c+=(m>>k)&1?iv[k]:o[k];

   e=Math.abs(c-Sn);if(e<best){best=e;bt='out';bv=Sn;bs=c}}

  for(const w of nb.keys()){if(++steps>LIM){aborted=true;return}

   else if(!ctl.has(w)&&!path.includes(w)&&path.length<20){path.push(w);dfsR(st,w,path);path.pop()}}};

 rts.forEach(r=>{const a=r[0],b=r[r.length-1],key=(a<=b?r:r.slice().reverse()).join(SEP);if(!rseen.has(key)){rseen.add(key);ur.push(r)}});

 ur.forEach(nd=>{const n=nd.length,[x0,y0]=ctl.get(nd[0]),[x1,y1]=ctl.get(nd[n-1]),px=[x0],py=[y0];let az=0;
  for(let j=0;j<n-1;j++){const a=nd[j],b=nd[j+1],sg=dm.get(a+SEP+b)||0;
   if(j>0){const pv=nd[j-1];for(const r of I.ang){if(r.g!==a)continue;
     if(r.t===pv&&r.p===b){az+=Math.PI-r.s*Math.PI/648000;break}

function khepHtml(I){

/* Đọc GSI-8/16 của máy thủy bình điện tử: 11 tên điểm, 331/335 mia sau, 332/336 mia trước, 333 ngắm trung gian */
function gsiParse(txt,tp){
 const U={'0':1e-3,'6':1e-4,'7':1e-5,'8':1e-6,'1':3.048e-4},S=[];let cur=null;
 txt.split(/\r?\n/).forEach(l=>{l=l.replace(/^\*/,'').trim();if(!l)return;
  const w=l.split(/\s+/).map(k=>{const n=/^(33|57)/.test(k)?3:2;return{wi:k.slice(0,n),u:k.charAt(5),sg:k.charAt(6),v:k.slice(7)}}),id=w.find(x=>x.wi==='11'),nm=id?id.v.replace(/^0+(?=.)/,''):'';
  w.forEach(x=>{if(!/^33[1-6]$/.test(x.wi))return;const v=(x.sg==='-'?-1:1)*Number(x.v)*(U[x.u]||1e-3);if(!isFinite(v))return;
   if(x.wi==='331'||x.wi==='335'){if(!cur||cur.f.length){cur={bp:'',fp:'',b:[],f:[],i:[]};S.push(cur)}cur.b.push(v);if(x.wi==='331')cur.bp=nm||cur.bp}
   else if(x.wi==='332'||x.wi==='336'){if(cur){cur.f.push(v);if(x.wi==='332')cur.fp=nm||cur.fp}}
   else if(x.wi==='333'&&cur&&cur.b.length)cur.i.push({p:nm,v})})});
 const isT=n=>tp.some(p=>p&&n.toUpperCase().startsWith(p)),av=a=>a.reduce((s,x)=>s+x,0)/a.length,L=[];let run=null,ns=0;
 S.forEach(s=>{if(!s.b.length||!s.f.length||!s.bp||!s.fp)return;ns++;
  const cont=run&&run.to===s.bp&&isT(run.to),base=cont?{from:run.from,h:run.h,n:run.n}:{from:s.bp,h:0,n:0},bb=av(s.b),h=bb-av(s.f);
  if(cont){run.h+=h;run.n++;run.to=s.fp}else{if(run)L.push(run);run={from:s.bp,to:s.fp,h,n:1}}
  s.i.forEach(q=>{if(q.p)L.push({from:base.from,to:q.p,h:base.h+bb-q.v,n:base.n+1})})});
 if(run)L.push(run);return{L,ns}}
$('limp').onclick=async()=>{const fs=[...$('lfile').files],cy=parseInt($('licy').value),tp=$('ltp').value.toUpperCase().split(',').map(x=>x.trim()),m=$('limsg');
 let L=[],ns=0;if(fs.length&&cy>0)for(const f of fs){const r=gsiParse(await f.text(),tp);L=L.concat(r.L);ns+=r.ns}
 if(!L.length){m.textContent=t('l.imperr');return}
 const raw=[...$('lc').querySelectorAll('tbody tr')].map(tr=>[...tr.querySelectorAll('input')].map(i=>i.value.trim()));
 if(!raw.some(r=>parseInt(r[0])===cy)){const e=raw.findIndex(r=>r.every(v=>v===''));if(e>=0)raw[e][0]=String(cy);else raw.push([String(cy),'','']);fill('lc',raw)}
 ltSync();const tid=ltById(cy);fill(tid,G(tid).map(r=>r.slice()).concat(L.map(o=>[o.from,o.to,o.h.toFixed(5),String(o.n)])));
 m.textContent=t('l.impok',L.length,ns,fs.length)};

/* sửa lỗi OCR hay gặp trong một token số: O->0, l/I->1, S->5, B->8, Z->2, dấu phẩy->chấm */
const phFix=x=>x.replace(/[\u2014\u2013\u2212]/g,'-').replace(/[Oo]/g,'0').replace(/[lI]/g,'1').replace(/S/g,'5').replace(/B/g,'8').replace(/Z/g,'2').replace(',','.');
/* tách văn bản OCR thành các dòng: [STT] điểm_đầu điểm_cuối chênh_cao số_trạm */
function phParse(text){const R=[];let skip=0;
 String(text).split(/\r?\n/).forEach(raw=>{
  const s=raw.replace(/[|\t;]/g,' ').replace(/[\u2014\u2013\u2212]/g,'-').replace(/(^|\s)([+-])\s+(?=[\dOoIl])/g,'$1$2').trim();
  if(!s)return;const tk=s.split(/\s+/);
  let k=-1;for(let i=1;i<tk.length;i++){if(/^[+-]?\d{0,2}\.\d{3,6}$/.test(phFix(tk[i]))){k=i;break}}
  if(k<0){skip++;return}
  const pre=tk.slice(0,k).map(x=>x.replace(/^[^\w]+|[^\w]+$/g,'')).filter(Boolean);
  if(pre.length>=3&&/^\d{1,3}$/.test(pre[0]))pre.shift();
  let n='';const nt=tk.slice(k+1).map(phFix).find(x=>/^\d{1,3}$/.test(x));if(nt!==undefined)n=String(parseInt(nt,10));

  R.push({f:pre[0]||'',t:pre[1]||'',dh,n})});
 return{R,skip}}
